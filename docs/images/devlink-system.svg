<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">DevLink无线串口系统</title>
  <desc id="desc">电脑通过USB连接Host，Host与Device通过2.4GHz无线链路通信，Device通过UART连接目标MCU，并可控制目标MCU的BOOT和RST。</desc>
  <defs>
    <linearGradient id="host" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2776d2"/><stop offset="1" stop-color="#1555a5"/></linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#168d91"/><stop offset="1" stop-color="#087078"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17324d" flood-opacity="0.15"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47739e"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15939a"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d8862d"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif}
      .title{font-size:30px;font-weight:700;fill:#17324d}.subtitle{font-size:15px;fill:#60758a;letter-spacing:1px}
      .node-title{font-size:23px;font-weight:700;fill:#17324d}.node-sub{font-size:15px;fill:#61768b}
      .inverse{fill:#fff}.inverse-sub{fill:#d8f3f1}.label{font-size:16px;font-weight:600;fill:#365d80}.small{font-size:14px;fill:#60758a}
    </style>
  </defs>

  <text x="600" y="62" text-anchor="middle" class="title">DevLink 无线串口系统</text>
  <text x="600" y="91" text-anchor="middle" class="subtitle">USB · 2.4 GHz RF · UART · REMOTE BOOT / RESET</text>

  <g filter="url(#shadow)"><rect x="48" y="192" width="210" height="158" rx="22" fill="#fff" stroke="#d5e1ec" stroke-width="2"/></g>
  <rect x="119" y="218" width="68" height="48" rx="7" fill="none" stroke="#47739e" stroke-width="4"/>
  <path d="M111 276h84l-8 8h-68z" fill="#47739e"/>
  <text x="153" y="315" text-anchor="middle" class="node-title">电脑</text><text x="153" y="338" text-anchor="middle" class="node-sub">串口工具 / ISP 软件</text>

  <g filter="url(#shadow)"><rect x="330" y="192" width="210" height="158" rx="22" fill="url(#host)"/></g>
  <rect x="398" y="220" width="74" height="43" rx="10" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M407 250h56M415 232h8m10 0h8m10 0h5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="435" y="304" text-anchor="middle" class="node-title inverse">Host</text><text x="435" y="330" text-anchor="middle" class="node-sub inverse-sub">USB 虚拟串口</text>

  <g filter="url(#shadow)"><rect x="660" y="192" width="220" height="158" rx="22" fill="url(#device)"/></g>
  <path d="M764 218c-22 17-22 41 0 58m12-49c-14 11-14 29 0 40m12-30c-6 5-6 15 0 20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="752" cy="247" r="4" fill="#fff"/>
  <text x="770" y="304" text-anchor="middle" class="node-title inverse">Device</text><text x="770" y="330" text-anchor="middle" class="node-sub inverse-sub">UART 与 BOOT / RST 控制</text>

  <g filter="url(#shadow)"><rect x="942" y="192" width="210" height="158" rx="22" fill="#fff" stroke="#d5e1ec" stroke-width="2"/></g>
  <rect x="1009" y="216" width="76" height="58" rx="8" fill="#e9f1f8" stroke="#47739e" stroke-width="3"/>
  <path d="M1021 208v8m16-8v8m16-8v8m16-8v8m-48 58v8m16-8v8m16-8v8m16-8v8m-60-62h-8m8 15h-8m8 15h-8m84-30h-8m8 15h-8m8 15h-8" stroke="#47739e" stroke-width="3" stroke-linecap="round"/>
  <text x="1047" y="315" text-anchor="middle" class="node-title">目标 MCU</text><text x="1047" y="338" text-anchor="middle" class="node-sub">UART / ISP</text>

  <line x1="263" y1="240" x2="321" y2="240" stroke="#47739e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="321" y1="292" x2="263" y2="292" stroke="#91a9bf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="292" y="218" text-anchor="middle" class="label">USB</text><text x="292" y="321" text-anchor="middle" class="small">双向数据</text>

  <line x1="545" y1="240" x2="651" y2="240" stroke="#15939a" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="651" y1="292" x2="545" y2="292" stroke="#75b8b7" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="598" y="218" text-anchor="middle" class="label">2.4 GHz RF</text><text x="598" y="321" text-anchor="middle" class="small">数据 / 参数 / 控制</text>

  <line x1="885" y1="240" x2="933" y2="240" stroke="#47739e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="933" y1="292" x2="885" y2="292" stroke="#91a9bf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="909" y="218" text-anchor="middle" class="label">UART</text><text x="909" y="321" text-anchor="middle" class="small">TX / RX</text>

  <path d="M770 358v58H1047v-58" fill="none" stroke="#d8862d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-orange)"/>
  <rect x="832" y="394" width="154" height="38" rx="19" fill="#fff2df" stroke="#f0d3ad"/>
  <text x="909" y="419" text-anchor="middle" font-size="15" font-weight="700" fill="#9d5b17">BOOT / RST 控制</text>
  <text x="600" y="526" text-anchor="middle" class="small">Host 连接电脑；Device 连接目标板。无线链路承载串口数据与远程下载控制。</text>
</svg>
